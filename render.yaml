# Render Blueprint (free plan) for FAMILY CHAOS. New -> Blueprint -> select this repo.
services:
  - type: web
    name: family-chaos
    runtime: node
    plan: free
    rootDir: family-chaos
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: TRUST_PROXY
        value: "1"
