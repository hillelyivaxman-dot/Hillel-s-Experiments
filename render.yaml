# Render Blueprint for FAMILY CHAOS — FREE plan only (no card needed).
# Render dashboard (phone browser): New -> Blueprint -> pick this repo -> branch below -> Apply.
services:
  - type: web
    name: family-chaos
    runtime: node
    plan: free
    region: frankfurt # closest Render region to Israel
    branch: ccr-64ced051-a2t8s8
    rootDir: family-chaos
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # RENDER_EXTERNAL_URL (the https://….onrender.com address) is injected by Render
      # automatically and used for QR codes / join links. No secrets are needed.
